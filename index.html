<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101611">
  <meta name="description" content="Эпохи — автономная пошаговая стратегия о становлении цивилизации">
  <title>Эпохи — стратегия сквозь века</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <main id="app">
    <section class="hero">
      <div class="hero-map" aria-hidden="true"></div>
      <div class="eyebrow">АВТОНОМНАЯ СТРАТЕГИЯ</div>
      <div class="hero-sigil">✦</div>
      <h1>ЭПОХИ</h1>
      <p>Возглавьте народ. Осваивайте земли, возводите города и проведите свою державу сквозь четыре эпохи.</p>
      <div><button id="new-game" class="primary">Начать летопись <span>→</span></button><button id="continue" class="secondary hidden">Продолжить</button></div>
      <div class="rules"><span>◇ 16 ходов</span><span>⌘ 12 земель</span><span>♜ 3 соперника</span></div>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
